<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejercicio 12</title>
    <link rel="stylesheet" href="css/ejercicio12.css">

<body>

    <div class="tarjeta">
        <h2>Pesos a Dólares</h2>

        <div class="campo">

            <input type="text" id="dolares" placeholder="Esperando cálculo..." readonly>
        </div>
    </div>
