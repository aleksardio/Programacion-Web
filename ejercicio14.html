<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14</title>
    <link rel="stylesheet" href="css/ejercicio14.css">
</head>
<body>

    <div class="tarjeta">
        <h2>Análisis de Números</h2>

        <div class="campo">
            <label for="numeros">Ingresa números separados por comas:</label>
            <input type="text" id="numeros" placeholder="Ej: 10, 20, 30, 40, 50">
        </div>
        <button type="button" id="btnCalcular">Calcular</button>
        <div class="campo">
            <label for="mayor">Número mayor:</label>
            <input type="text" id="mayor" placeholder="-" readonly>
        </div>
        <div class="campo">
            <label for="menor">Número menor:</label>
            <input type="text" id="menor" placeholder="-" readonly>
        </div>
        <div class="campo">
            <label for="promedio">Promedio:</label>
            <input type="text" id="promedio" placeholder="-" readonly>
        </div>
    </div>
    <p><a href="index.html">← Volver al inicio</a></p>

    <script src="js/ejercicio14.js"></script>
</body>
</html>
