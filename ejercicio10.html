<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura | Ejercicio 10</title>
    <link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>

    <div class="tarjeta">
        <h2>Celsius a Fahrenheit</h2>

        <div class="campo">
            <label for="celsius">Grados Celsius (°C):</label>
            <input type="number" id="celsius" placeholder="Ej: 25" step="any">
        </div>

        <button type="button" id="btnConvertir">Convertir</button>

        <div class="campo">
            <label for="resultado">Resultado en Fahrenheit (°F):</label>
            <input type="text" id="resultado" placeholder="Esperando cálculo..." readonly>
        </div>
    </div>

    <script src="js/ejercicio10.js"></script>
    <p><a href="index.html">← Volver al inicio</a></p>
</body>
</html>
