<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 16</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/ejercicio16.css">
</head>
<body>

    <div class="tarjeta">
        <h2>Calculadora Básica</h2>
        <div class="campo">
            <label for="numero1">Número 1:</label>
            <input type="number" id="numero1" placeholder="Ej: 15" step="any">
        </div>

        <div class="campo">
            <label for="numero2">Número 2:</label>
            <input type="number" id="numero2" placeholder="Ej: 5" step="any">
        </div>
        <div class="botones-grid">
            <button type="button" id="btnSumar">+</button>
            <button type="button" id="btnRestar">-</button>
            <button type="button" id="btnMultiplicar">x</button>
            <button type="button" id="btnDividir">/</button>
        </div>
        <div class="campo">
            <label for="resultado">Resultado:</label>
            <input type="text" id="resultado" placeholder="-" readonly>
        </div>
    </div>

    <p><a href="index.html">← Volver al inicio</a></p>

    <script src="js/ejercicio16.js"></script>
</body>
</html>
