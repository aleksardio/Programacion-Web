<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
</head>
<body>

    <div class="tarjeta">
        <h2>Kilómetros a Millas</h2>

        <div class="campo">
            <label for="kilometros">Distancia en Kilómetros (K):</label>
            <input type="number" id="kilometros" placeholder="Ej: 10" step="any">
        </div>

        <button type="button" id="btnConvertir">Convertir</button>

        <div class="campo">
            <label for="millas">Resultado en Millas (M):</label>
            <input type="text" id="millas" placeholder="Esperando cálculo..." readonly>
        </div>
    </div>

    <p><a href="index.html">← Volver al inicio</a></p>

    <script src="js/ejercicio11.js"></script>
</body>
</html>
